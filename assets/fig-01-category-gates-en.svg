-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:47.917px;fill:#d9eee8;">fully accountable</text><text x="1135.56px" y="1208.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:58.333px;fill:#5b6475;">The dividing line is not capability strength, but organizational status: on the roster, accountable, cultivable.</text></svg>