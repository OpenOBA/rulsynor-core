<?xml version="1.0" encoding="UTF-8" standalone="no"?><!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd"><svg width="100%" height="100%" viewBox="0 0 5167 1959" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;"><rect x="0" y="0" width="5166.67" height="1958.33" style="fill:#fff;"/><path d="M1250,500l241.667,0" style="fill:none;fill-rule:nonzero;stroke:#64748b;stroke-width:8.33px;"/><path d="M2500,500l241.667,0" style="fill:none;fill-rule:nonzero;stroke:#64748b;stroke-width:8.33px;"/><path d="M3750,500l241.667,0" style="fill:none;fill-rule:nonzero;stroke:#64748b;stroke-width:8.33px;"/><path d="M4500,708.333l0,450" style="fill:none;fill-rule:nonzero;stroke:#64748b;stroke-width:8.33px;"/><path d="M4000,1375l-241.667,0" style="fill:none;fill-rule:nonzero;stroke:#64748b;stroke-width:8.33px;"/><path d="M2750,1375l-241.667,0" style="fill:none;fill-rule:nonzero;stroke:#64748b;stroke-width:8.33px;"/><path d="M1250,333.333c0,-22.996 -18.67,-41.666 -41.667,-41.666l-916.666,-0c-22.997,-0 -41.667,18.67 -41.667,41.666l0,333.334c0,22.996 18.67,41.666 41.667,41.666l916.666,0c22.997,0 41.667,-18.67 41.667,-41.666l0,-333.334Z" style="fill:#eff6ff;stroke:#1e56a0;stroke-width:6.25px;"/><text x="350px" y="441.667px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:66.667px;fill:#172033;">① Understand Intent</text><text x="350px" y="558.333px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">Human instruction →</text><text x="350px" y="641.667px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">structured task, instantly</text><path d="M1195.83,404.167c0,-29.896 -24.271,-54.167 -54.166,-54.167l-75,0c-29.896,0 -54.167,24.271 -54.167,54.167c-0,29.895 24.271,54.166 54.167,54.166l75,0c29.895,0 54.166,-24.271 54.166,-54.166Z" style="fill:#1e56a0;"/><text x="1054.27px" y="425px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#fff;">Fast</text><path d="M2500,333.333c0,-22.996 -18.67,-41.666 -41.667,-41.666l-916.666,-0c-22.997,-0 -41.667,18.67 -41.667,41.666l0,333.334c0,22.996 18.67,41.666 41.667,41.666l916.666,0c22.997,0 41.667,-18.67 41.667,-41.666l0,-333.334Z" style="fill:#eff6ff;stroke:#1e56a0;stroke-width:6.25px;"/><text x="1600px" y="441.667px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:66.667px;fill:#172033;">② Make a Plan</text><text x="1600px" y="558.333px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">Think before acting;</text><g transform="matrix(50,0,0,50,1853,641.667)"></g><g transform="matrix(50,0,0,50,1871.03,641.667)"></g><text x="1600px" y="641.667px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">risks identiﬁed up front</text><path d="M2416.67,404.167c-0,-29.896 -24.272,-54.167 -54.167,-54.167l-75,0c-29.895,0 -54.167,24.271 -54.167,54.167c0,29.895 24.272,54.166 54.167,54.166l75,0c29.895,0 54.167,-24.271 54.167,-54.166Z" style="fill:#1e56a0;"/><text x="2264.15px" y="425px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#fff;">Right</text><path d="M3750,333.333c0,-22.996 -18.67,-41.666 -41.667,-41.666l-916.666,-0c-22.997,-0 -41.667,18.67 -41.667,41.666l0,333.334c0,22.996 18.67,41.666 41.667,41.666l916.666,0c22.997,0 41.667,-18.67 41.667,-41.666l0,-333.334Z" style="fill:#eff6ff;stroke:#1e56a0;stroke-width:6.25px;"/><text x="2850px" y="441.667px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:66.667px;fill:#172033;">③ Assemble Basis</text><text x="2850px" y="558.333px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">Knowledge, experience,</text><text x="2850px" y="641.667px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">rules — injected once</text><path d="M3666.67,404.167c-0,-29.896 -24.272,-54.167 -54.167,-54.167l-75,0c-29.895,0 -54.167,24.271 -54.167,54.167c0,29.895 24.272,54.166 54.167,54.166l75,0c29.895,0 54.167,-24.271 54.167,-54.166Z" style="fill:#1e56a0;"/><text x="3505.62px" y="425px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#fff;">Focus</text><path d="M5000,333.333c0,-22.996 -18.67,-41.666 -41.667,-41.666l-916.666,-0c-22.997,-0 -41.667,18.67 -41.667,41.666l0,333.334c0,22.996 18.67,41.666 41.667,41.666l916.666,0c22.997,0 41.667,-18.67 41.667,-41.666l0,-333.334Z" style="fill:#eff6ff;stroke:#1e56a0;stroke-width:6.25px;"/><text x="4100px" y="441.667px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:66.667px;fill:#172033;">④ Reason &amp; Decide</text><text x="4100px" y="558.333px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">Reasoning visible,</text><text x="4100px" y="641.667px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">streamed with tool calls</text><path d="M4916.67,404.167c-0,-29.896 -24.272,-54.167 -54.167,-54.167l-75,0c-29.895,0 -54.167,24.271 -54.167,54.167c0,29.895 24.272,54.166 54.167,54.166l75,0c29.895,0 54.167,-24.271 54.167,-54.166Z" style="fill:#1e56a0;"/><text x="4763.32px" y="425px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#fff;">Open</text><path d="M5000,1208.33c0,-22.996 -18.67,-41.666 -41.667,-41.666l-916.666,-0c-22.997,-0 -41.667,18.67 -41.667,41.666l0,333.334c0,22.996 18.67,41.666 41.667,41.666l916.666,0c22.997,0 41.667,-18.67 41.667,-41.666l0,-333.334Z" style="fill:#f0fdf9;stroke:#0e7c66;stroke-width:6.25px;"/><text x="4100px" y="1316.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:66.667px;fill:#172033;">⑤ Rule Gate</text><text x="4100px" y="1433.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">Every action adjudicated:</text><text x="4100px" y="1516.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">release / correct / escalate</text><path d="M4916.67,1279.17c-0,-29.896 -24.272,-54.167 -54.167,-54.167l-75,0c-29.895,0 -54.167,24.271 -54.167,54.167c0,29.895 24.272,54.166 54.167,54.166l75,0c29.895,0 54.167,-24.271 54.167,-54.166Z" style="fill:#0e7c66;"/><text x="4751.95px" y="1300px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#fff;">Stable</text><path d="M3750,1208.33c0,-22.996 -18.67,-41.666 -41.667,-41.666l-916.666,-0c-22.997,-0 -41.667,18.67 -41.667,41.666l0,333.334c0,22.996 18.67,41.666 41.667,41.666l916.666,0c22.997,0 41.667,-18.67 41.667,-41.666l0,-333.334Z" style="fill:#f0fdf9;stroke:#0e7c66;stroke-width:6.25px;"/><text x="2850px" y="1316.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:66.667px;fill:#172033;">⑥ Execute</text><text x="2850px" y="1433.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">Controlled execution,</text><text x="2850px" y="1516.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">results feed back</text><path d="M3666.67,1279.17c-0,-29.896 -24.272,-54.167 -54.167,-54.167l-75,0c-29.895,0 -54.167,24.271 -54.167,54.167c0,29.895 24.272,54.166 54.167,54.166l75,0c29.895,0 54.167,-24.271 54.167,-54.166Z" style="fill:#0e7c66;"/><text x="3517.62px" y="1300px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#fff;">Solid</text><path d="M2500,1208.33c0,-22.996 -18.67,-41.666 -41.667,-41.666l-916.666,-0c-22.997,-0 -41.667,18.67 -41.667,41.666l0,333.334c0,22.996 18.67,41.666 41.667,41.666l916.666,0c22.997,0 41.667,-18.67 41.667,-41.666l0,-333.334Z" style="fill:#eef2ff;stroke:#43549e;stroke-width:6.25px;"/><text x="1600px" y="1316.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:66.667px;fill:#172033;">⑦ Audit &amp; Anchor</text><text x="1600px" y="1433.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">Result becomes evidence,</text><text x="1600px" y="1516.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#5b6475;">independently recomputable</text><path d="M2416.67,1279.17c-0,-29.896 -24.272,-54.167 -54.167,-54.167l-75,0c-29.895,0 -54.167,24.271 -54.167,54.167c0,29.895 24.272,54.166 54.167,54.166l75,0c29.895,0 54.167,-24.271 54.167,-54.166Z" style="fill:#43549e;"/><text x="2261.2px" y="1300px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#fff;">Proof</text><text x="333.333px" y="1375px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#8a94a6;">④–⑥ form the execution</text><text x="333.333px" y="1458.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#8a94a6;">iteration loop, until done</text><text x="333.333px" y="1541.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#8a94a6;">or human escalation</text><g transform="matrix(54.1667,0,0,54.1667,2144.39,1816.67)"></g><g transform="matrix(54.1667,0,0,54.1667,2163.92,1816.67)"></g><text x="1423.6px" y="1816.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:54.167px;fill:#5b6475;">Seven-Step Method — plan ﬁrst, execute, verify while executing, leave evidence throughout</text></svg>