<?xml version="1.0" encoding="UTF-8" standalone="no"?><!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd"><svg width="100%" height="100%" viewBox="0 0 5167 2167" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;"><rect x="0" y="0" width="5166.67" height="2166.67" style="fill:#fff;"/><path d="M4208.33,183.333c0,-22.996 -18.67,-41.666 -41.666,-41.666l-3166.67,-0c-22.996,-0 -41.667,18.67 -41.667,41.666l0,275c0,22.997 18.671,41.667 41.667,41.667l3166.67,0c22.996,0 41.666,-18.67 41.666,-41.667l0,-275Z" style="fill:#172033;"/><text x="1954.73px" y="291.667px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:91.667px;fill:#fff;">Professionalized AI Employee</text><text x="1725.34px" y="416.667px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:52.083px;fill:#c9d2e0;">The three necessary conditions for entrusting a role to an AI Employee</text><rect x="1041.67" y="550" width="3083.33" height="108.333" style="fill:#3b4759;"/><path d="M1966.67,750c-0,-18.397 -14.936,-33.333 -33.334,-33.333l-850,-0c-18.397,-0 -33.333,14.936 -33.333,33.333l0,891.667c0,18.397 14.936,33.333 33.333,33.333l850,0c18.398,0 33.334,-14.936 33.334,-33.333l-0,-891.667Z" style="fill:#eff6ff;stroke:#1e56a0;stroke-width:6.25px;"/><path d="M3041.67,750c-0,-18.397 -14.936,-33.333 -33.334,-33.333l-850,-0c-18.397,-0 -33.333,14.936 -33.333,33.333l0,891.667c0,18.397 14.936,33.333 33.333,33.333l850,0c18.398,0 33.334,-14.936 33.334,-33.333l-0,-891.667Z" style="fill:#f0fdf9;stroke:#0e7c66;stroke-width:6.25px;"/><path d="M4116.67,750c-0,-18.397 -14.936,-33.333 -33.334,-33.333l-850,-0c-18.397,-0 -33.333,14.936 -33.333,33.333l-0,891.667c-0,18.397 14.936,33.333 33.333,33.333l850,0c18.398,0 33.334,-14.936 33.334,-33.333l-0,-891.667Z" style="fill:#fff7ed;stroke:#c77414;stroke-width:6.25px;"/><text x="1194.63px" y="883.333px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:79.167px;fill:#1e56a0;">P1 · Trustworthy</text><text x="1339.79px" y="1050px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:52.083px;fill:#334155;">No overreach,</text><text x="1295.65px" y="1125px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:52.083px;fill:#334155;">no loss of control</text><text x="1229.36px" y="1225px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:47.917px;fill:#334155;">Every step independently</text><g transform="matrix(47.9167,0,0,47.9167,1487.13,1291.67)"></g><g transform="matrix(47.9167,0,0,47.9167,1504.41,1291.67)"></g><text x="1407.68px" y="1291.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:47.917px;fill:#334155;">veriﬁable</text><g transform="matrix(47.9167,0,0,47.9167,1603.35,1408.33)"></g><g transform="matrix(47.9167,0,0,47.9167,1620.63,1408.33)"></g><text x="1325.48px" y="1408.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:47.917px;fill:#5b6475;">Compliance ﬁrst</text><text x="1255.17px" y="1483.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:47.917px;fill:#5b6475;">Evidence · Audit chain</text><text x="1269.43px" y="1600px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:45.833px;fill:#8a94a6;">Precondition for hiring</text><text x="2284.8px" y="883.333px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:79.167px;fill:#0e7c66;">P2 · Competent</text><text x="2332.42px" y="1050px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:52.083px;fill:#334155;">Genuinely completes</text><text x="2389.19px" y="1125px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:52.083px;fill:#334155;">the role&apos;s duties</text><text x="2462.25px" y="1225px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:47.917px;fill:#334155;">Not merely</text><text x="2437.95px" y="1291.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:47.917px;fill:#334155;">interceptable</text><text x="2335.05px" y="1408.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:47.917px;fill:#5b6475;">Five-in-one capability</text><text x="2351.06px" y="1483.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:47.917px;fill:#5b6475;">Structured execution</text><text x="2420.12px" y="1600px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:45.833px;fill:#8a94a6;">Value of tenure</text><text x="3341.98px" y="883.333px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:79.167px;fill:#c77414;">P3 · Controllable</text><text x="3467.92px" y="1050px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:52.083px;fill:#334155;">However strong</text><text x="3495.99px" y="1125px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:52.083px;fill:#334155;">the capability</text><text x="3505.74px" y="1225px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:47.917px;fill:#334155;">Final decision</text><text x="3455.48px" y="1291.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:47.917px;fill:#334155;">rests with humans</text><text x="3445.32px" y="1408.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:47.917px;fill:#5b6475;">Human sovereignty</text><text x="3482.07px" y="1483.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:47.917px;fill:#5b6475;">Approval · Veto</text><text x="3398.85px" y="1600px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:45.833px;fill:#8a94a6;">Organizational boundary</text><path d="M4291.67,1762.5c-0,-18.397 -14.936,-33.333 -33.334,-33.333l-3350,-0c-18.397,-0 -33.333,14.936 -33.333,33.333l-0,150c-0,18.397 14.936,33.333 33.333,33.333l3350,0c18.398,0 33.334,-14.936 33.334,-33.333l-0,-150Z" style="fill:#172033;"/><text x="1159.98px" y="1858.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:56.25px;fill:#fff;">Deterministic architecture, not prompt engineering — boundaries guaranteed by mechanism, not by prompts</text><text x="1500.91px" y="2050px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:52.083px;fill:#5b6475;">Priority: P1 precondition → P2 value → P3 boundary. Missing any one, the category fails.</text></svg>