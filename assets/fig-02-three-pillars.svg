<?xml version="1.0" encoding="UTF-8" standalone="no"?><!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd"><svg width="100%" height="100%" viewBox="0 0 89709 37625" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;"><rect x="0" y="0" width="89699.2" height="37615.8" style="fill:#fff;"/><path d="M73061.2,2821.18c0,-399.233 -324.129,-723.383 -723.367,-723.383l-54977.1,-0c-399.237,-0 -723.387,324.15 -723.387,723.383l-0,4774.29c-0,399.233 324.149,723.383 723.387,723.383l54977.1,0c399.238,0 723.367,-324.15 723.367,-723.383l0,-4774.29Z" style="fill:#172033;"/><text x="39758.3px" y="4991.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1736.11px;fill:#fff;">职业化AI员工</text><text x="34276px" y="7161.46px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1012.73px;fill:#c9d2e0;">企业把一个正式岗位交给AI员工的三个必要条件</text><rect x="18084.5" y="9042.25" width="53530" height="1880.78" style="fill:#3b4759;"/><path d="M34143.6,12225.1c0,-319.408 -259.304,-578.712 -578.712,-578.712l-14757,-0c-319.391,-0 -578.699,259.304 -578.699,578.712l-0,15480.3c-0,319.413 259.308,578.717 578.7,578.717l14757,0c319.408,0 578.712,-259.304 578.712,-578.717l0,-15480.3Z" style="fill:#eff6ff;stroke:#1e56a0;stroke-width:108.5px;"/><path d="M52806.7,12225.1c-0,-319.408 -259.304,-578.712 -578.717,-578.712l-14757,-0c-319.392,-0 -578.7,259.304 -578.7,578.712l-0,15480.3c-0,319.413 259.308,578.717 578.7,578.717l14757,0c319.412,0 578.717,-259.304 578.717,-578.717l-0,-15480.3Z" style="fill:#f0fdf9;stroke:#0e7c66;stroke-width:108.5px;"/><path d="M71470,12225.1c0,-319.408 -259.308,-578.712 -578.717,-578.712l-14757,-0c-319.392,-0 -578.696,259.304 -578.696,578.712l0,15480.3c0,319.413 259.304,578.717 578.696,578.717l14757,0c319.409,0 578.717,-259.304 578.717,-578.717l0,-15480.3Z" style="fill:#fff7ed;stroke:#c77414;stroke-width:108.5px;"/><text x="22997.8px" y="14539.9px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1446.75px;fill:#1e56a0;">P1 · 可信</text><text x="22641.8px" y="17433.5px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1012.73px;fill:#334155;">不越权、不失控</text><text x="21629px" y="19314.2px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1012.73px;fill:#334155;">每一步可被独立验证</text><text x="24305.5px" y="22497px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:940.4px;fill:#5b6475;">合规前置</text><text x="22346.7px" y="24088.5px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:940.4px;fill:#5b6475;">决策证据 · 审计链</text><text x="24450.2px" y="26548.1px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:868.054px;fill:#8a94a6;">录用前提</text><text x="41660.9px" y="14539.9px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1446.75px;fill:#0e7c66;">P2 · 胜任</text><text x="39785.9px" y="17433.5px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1012.73px;fill:#334155;">能把岗位职责真正完成</text><text x="40798.6px" y="19314.2px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1012.73px;fill:#334155;">而非仅仅可被拦截</text><text x="42028.3px" y="22497px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:940.4px;fill:#5b6475;">五位一体能力</text><text x="41558.2px" y="24088.5px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:940.4px;fill:#5b6475;">结构化执行程序</text><text x="43113.3px" y="26548.1px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:868.054px;fill:#8a94a6;">履约价值</text><text x="60324.2px" y="14539.9px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1446.75px;fill:#c77414;">P3 · 可控</text><text x="60474.6px" y="17433.5px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1012.73px;fill:#334155;">无论能力多强</text><text x="59968.3px" y="19314.2px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1012.73px;fill:#334155;">最终决策权在人</text><text x="61632.1px" y="22497px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:940.4px;fill:#5b6475;">人类主权</text><text x="60143.3px" y="24088.5px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:940.4px;fill:#5b6475;">审批权 · 否决权</text><text x="61776.7px" y="26548.1px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:868.054px;fill:#8a94a6;">组织边界</text><path d="M74508.3,29803.3c0,-319.413 -259.304,-578.717 -578.712,-578.717l-58159.6,0c-319.392,0 -578.696,259.304 -578.696,578.717l-0,2604.17c-0,319.392 259.304,578.696 578.696,578.696l58159.6,0c319.408,0 578.712,-259.304 578.712,-578.696l0,-2604.17Z" style="fill:#172033;"/><text x="26554.7px" y="31611.6px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1085.07px;fill:#fff;">确定性架构，而非 Prompt 工程 —— 行为边界由机制保证，不由提示词保证</text><text x="25072.4px" y="34939.2px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1012.73px;fill:#5b6475;">优先级：P1 是录用前提 → P2 是履约价值 → P3 是组织边界。任一缺失，品类不成立。</text></svg>