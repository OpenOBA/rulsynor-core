<?xml version="1.0" encoding="UTF-8" standalone="no"?><!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd"><svg width="100%" height="100%" viewBox="0 0 5167 2334" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;"><rect x="0" y="0" width="5166.67" height="2333.33" style="fill:#fff;"/><path d="M1375,491.667l0,166.666" style="fill:none;fill-rule:nonzero;stroke:#64748b;stroke-width:8.33px;"/><path d="M3791.67,491.667l-0,166.666" style="fill:none;fill-rule:nonzero;stroke:#64748b;stroke-width:8.33px;"/><path d="M2333.33,1166.67l491.667,-0" style="fill:none;fill-rule:nonzero;stroke:#64748b;stroke-width:8.33px;"/><path d="M4750,225c0,-22.996 -18.67,-41.667 -41.667,-41.667l-4250,0c-22.996,0 -41.666,18.671 -41.666,41.667l-0,225c-0,22.996 18.67,41.667 41.666,41.667l4250,-0c22.997,-0 41.667,-18.671 41.667,-41.667l0,-225Z" style="fill:#fff7ed;stroke:#c77414;stroke-width:6.25px;"/><text x="541.667px" y="308.333px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:70.833px;fill:#c77414;">Human–Machine Interface — the entry and exit of tasks</text><g transform="matrix(52.0833,0,0,52.0833,1086.88,416.667)"></g><g transform="matrix(52.0833,0,0,52.0833,1105.65,416.667)"></g><text x="541.667px" y="416.667px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:52.083px;fill:#5b6475;">Human instructions deﬁne the task&apos;s start and goal; human adjudication guards its end and baseline</text><path d="M4583.33,337.5c0,-43.693 -35.473,-79.167 -79.166,-79.167l-591.667,0c-43.693,0 -79.167,35.474 -79.167,79.167c0,43.693 35.474,79.167 79.167,79.167l591.667,-0c43.693,-0 79.166,-35.474 79.166,-79.167Z" style="fill:#c77414;"/><text x="3890.5px" y="362.5px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:58.333px;fill:#fff;">Authorization · humans</text><path d="M2333.33,708.333c0,-22.996 -18.67,-41.666 -41.666,-41.666l-1833.33,-0c-22.996,-0 -41.666,18.67 -41.666,41.666l-0,916.667c-0,22.996 18.67,41.667 41.666,41.667l1833.33,-0c22.996,-0 41.666,-18.671 41.666,-41.667l0,-916.667Z" style="fill:#eff6ff;stroke:#1e56a0;stroke-width:6.25px;"/><text x="541.667px" y="816.667px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:70.833px;fill:#1e56a0;">Intelligence Layer — task completion</text><text x="541.667px" y="975px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:54.167px;fill:#334155;">· Reasoning &amp; planning: decomposition, design</text><text x="541.667px" y="1091.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:54.167px;fill:#334155;">· Knowledge retrieval: enterprise-private basis</text><text x="541.667px" y="1208.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:54.167px;fill:#334155;">· Memory recall: continuous reuse of history</text><text x="541.667px" y="1325px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:54.167px;fill:#334155;">· Tool ecosystem: external capability via protocols</text><path d="M1375,1512.5c0,-43.693 -35.473,-79.167 -79.167,-79.167l-675,0c-43.693,0 -79.166,35.474 -79.166,79.167c-0,43.693 35.473,79.167 79.166,79.167l675,-0c43.694,-0 79.167,-35.474 79.167,-79.167Z" style="fill:#1e56a0;"/><text x="636.333px" y="1537.5px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:58.333px;fill:#fff;">Capability · intelligence</text><path d="M4750,708.333c0,-22.996 -18.67,-41.666 -41.667,-41.666l-1833.33,-0c-22.996,-0 -41.667,18.67 -41.667,41.666l0,916.667c0,22.996 18.671,41.667 41.667,41.667l1833.33,-0c22.997,-0 41.667,-18.671 41.667,-41.667l0,-916.667Z" style="fill:#f0fdf9;stroke:#0e7c66;stroke-width:6.25px;"/><text x="2958.33px" y="816.667px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:70.833px;fill:#0e7c66;">Deterministic Layer — boundary, not bypassable</text><text x="2958.33px" y="975px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:54.167px;fill:#334155;">· Intent translation: instant structuring, no model cost</text><g transform="matrix(54.1667,0,0,54.1667,3862.05,1091.67)"></g><g transform="matrix(54.1667,0,0,54.1667,3881.58,1091.67)"></g><text x="2958.33px" y="1091.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:54.167px;fill:#334155;">· Plan review: high-risk steps identiﬁed pre-execution</text><text x="2958.33px" y="1208.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:54.167px;fill:#334155;">· Action adjudication: protocol-level, not prompts</text><text x="2958.33px" y="1325px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:54.167px;fill:#334155;">· Audit chain: every decision recomputable</text><path d="M3833.33,1512.5c0,-43.693 -35.473,-79.167 -79.166,-79.167l-716.667,0c-43.693,0 -79.167,35.474 -79.167,79.167c0,43.693 35.474,79.167 79.167,79.167l716.667,-0c43.693,-0 79.166,-35.474 79.166,-79.167Z" style="fill:#0e7c66;"/><text x="3067.53px" y="1537.5px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:58.333px;fill:#fff;">Boundary · determinism</text><text x="2435.92px" y="1100px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#8a94a6;">Every action</text><text x="2232.82px" y="1258.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:50px;fill:#8a94a6;">passes boundary adjudication</text><path d="M4750,1858.33c0,-22.996 -18.67,-41.666 -41.667,-41.666l-4250,-0c-22.996,-0 -41.666,18.67 -41.666,41.666l-0,150c-0,22.997 18.67,41.667 41.666,41.667l4250,0c22.997,0 41.667,-18.67 41.667,-41.667l0,-150Z" style="fill:#172033;"/><text x="457.783px" y="1948.38px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:58.333px;fill:#fff;">Capability to the intelligence layer, boundary to the deterministic layer, authorization to humans — capability and governance no longer consume each other</text></svg>