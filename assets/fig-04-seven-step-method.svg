<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arw6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>

  <!-- connectors: top row -->
  <path d="M300 120 H358" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arw6)"/>
  <path d="M600 120 H658" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arw6)"/>
  <path d="M900 120 H958" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arw6)"/>
  <!-- connector: 4 down to 5 -->
  <path d="M1080 170 V278" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arw6)"/>
  <!-- connectors: bottom row right to left -->
  <path d="M960 330 H902" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arw6)"/>
  <path d="M660 330 H602" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arw6)"/>

  <!-- top row boxes -->
  <rect x="60" y="70" width="240" height="100" rx="10" fill="#EFF6FF" stroke="#1E56A0" stroke-width="1.5"/>
  <text x="84" y="106" font-size="17" font-weight="700" fill="#172033">① 理解意图</text>
  <text x="84" y="134" font-size="13" fill="#5B6475">人的指令毫秒级转译</text>
  <text x="84" y="156" font-size="13" fill="#5B6475">为结构化任务</text>
  <rect x="236" y="84" width="44" height="26" rx="13" fill="#1E56A0"/>
  <text x="258" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">快</text>

  <rect x="360" y="70" width="240" height="100" rx="10" fill="#EFF6FF" stroke="#1E56A0" stroke-width="1.5"/>
  <text x="384" y="106" font-size="17" font-weight="700" fill="#172033">② 制定计划</text>
  <text x="384" y="134" font-size="13" fill="#5B6475">先想清楚再动手</text>
  <text x="384" y="156" font-size="13" fill="#5B6475">高危步骤前置识别</text>
  <rect x="536" y="84" width="44" height="26" rx="13" fill="#1E56A0"/>
  <text x="558" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">准</text>

  <rect x="660" y="70" width="240" height="100" rx="10" fill="#EFF6FF" stroke="#1E56A0" stroke-width="1.5"/>
  <text x="684" y="106" font-size="17" font-weight="700" fill="#172033">③ 组装依据</text>
  <text x="684" y="134" font-size="13" fill="#5B6475">知识 · 经验 · 行为章法</text>
  <text x="684" y="156" font-size="13" fill="#5B6475">一次注入，口径一致</text>
  <rect x="836" y="84" width="44" height="26" rx="13" fill="#1E56A0"/>
  <text x="858" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">专</text>

  <rect x="960" y="70" width="240" height="100" rx="10" fill="#EFF6FF" stroke="#1E56A0" stroke-width="1.5"/>
  <text x="984" y="106" font-size="17" font-weight="700" fill="#172033">④ 推理决策</text>
  <text x="984" y="134" font-size="13" fill="#5B6475">思考过程实时可见</text>
  <text x="984" y="156" font-size="13" fill="#5B6475">与工具调用流式输出</text>
  <rect x="1136" y="84" width="44" height="26" rx="13" fill="#1E56A0"/>
  <text x="1158" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">透</text>

  <!-- bottom row boxes -->
  <rect x="960" y="280" width="240" height="100" rx="10" fill="#F0FDF9" stroke="#0E7C66" stroke-width="1.5"/>
  <text x="984" y="316" font-size="17" font-weight="700" fill="#172033">⑤ 规则把关</text>
  <text x="984" y="344" font-size="13" fill="#5B6475">每次行动经边界裁决：</text>
  <text x="984" y="366" font-size="13" fill="#5B6475">放行 / 纠正 / 升级人工</text>
  <rect x="1136" y="294" width="44" height="26" rx="13" fill="#0E7C66"/>
  <text x="1158" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">稳</text>

  <rect x="660" y="280" width="240" height="100" rx="10" fill="#F0FDF9" stroke="#0E7C66" stroke-width="1.5"/>
  <text x="684" y="316" font-size="17" font-weight="700" fill="#172033">⑥ 执行操作</text>
  <text x="684" y="344" font-size="13" fill="#5B6475">受控执行，结果回流</text>
  <text x="684" y="366" font-size="13" fill="#5B6475">驱动下一轮迭代</text>
  <rect x="836" y="294" width="44" height="26" rx="13" fill="#0E7C66"/>
  <text x="858" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">靠</text>

  <rect x="360" y="280" width="240" height="100" rx="10" fill="#EEF2FF" stroke="#43549E" stroke-width="1.5"/>
  <text x="384" y="316" font-size="17" font-weight="700" fill="#172033">⑦ 审计落链</text>
  <text x="384" y="344" font-size="13" fill="#5B6475">裁决与结果即成证据</text>
  <text x="384" y="366" font-size="13" fill="#5B6475">可独立重算、可举证</text>
  <rect x="536" y="294" width="44" height="26" rx="13" fill="#43549E"/>
  <text x="558" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">证</text>

  <!-- react loop note -->
  <text x="80" y="330" font-size="13" fill="#8A94A6">④ 至 ⑥ 构成执行迭代环，</text>
  <text x="80" y="352" font-size="13" fill="#8A94A6">直至任务完成或升级人工</text>

  <!-- caption -->
  <text x="620" y="434" text-anchor="middle" font-size="14" fill="#5B6475">七步工作法 —— 先计划、再执行、边执行边验证、全程留证</text>
</svg>
