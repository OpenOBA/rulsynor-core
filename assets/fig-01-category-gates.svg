PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1085.07px;fill:#334155;">组织身份 · 定岗授权 · 岗前持证</text><text x="37074px" y="11718.8px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1085.07px;fill:#334155;">履职审计 · 晋升降级 · 退役传承</text><text x="39677.4px" y="13599.5px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:940.4px;fill:#8a94a6;">六要素缺一，即非本品类</text><path d="M85358.8,5208.33c0,-479.096 -388.975,-868.054 -868.054,-868.054l-22858.8,0c-479.1,0 -868.059,388.958 -868.059,868.054l0,8391.21c0,479.096 388.959,868.054 868.059,868.054l22858.8,-0c479.079,-0 868.054,-388.958 868.054,-868.054l0,-8391.21Z" style="fill:#0e7c66;stroke:#0e7c66;stroke-width:108.5px;"/><text x="68394.4px" y="8391.21px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1591.44px;fill:#fff;">职业化AI员工</text><text x="66394.6px" y="10995.4px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1012.73px;fill:#d9eee8;">以组织身份定义 · 全程可问责</text><text x="24775.7px" y="19675.9px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:1085.07px;fill:#5b6475;">品类的分界线不是能力强弱，而是组织地位：是否在册、是否可问责、是否可培养。</text></svg>