version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      dev-deps:
        patterns:
          - "eslint*"
          - "prettier*"
          - "jest*"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      test-deps:
        patterns:
          - "jest*"
          - "ts-jest*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
