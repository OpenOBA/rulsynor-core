name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Smoke test — dangerous command must be DENY
        run: |
          node dist/playground.js --tool=exec --cmd="rm -rf /" | tee /dev/stderr | grep -q "DENY" || { echo "FAIL: expected DENY"; exit 1; }
