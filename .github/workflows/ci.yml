name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Smoke test — dangerous command must be DENY
        run: |
          node dist/playground.js --json --tool=exec --cmd="rm -rf /" | jq -r .decision | grep -q "DENY" || { echo "FAIL: rm -rf / was not denied"; exit 1; }
      - name: Smoke test — safe command must be ALLOW
        run: |
          node dist/playground.js --json --tool=read --path="README.md" | jq -r .decision | grep -q "ALLOW" || { echo "FAIL: read was not allowed"; exit 1; }
