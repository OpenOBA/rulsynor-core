name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - name: Smoke test — dangerous command must be DENY
        run: |
          OUTPUT=$(node dist/playground.js --tool=exec --cmd="rm -rf /")
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "DENY" || { echo "FAIL: rm -rf / was not denied"; exit 1; }
