name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Smoke test — dangerous command must be DENY
        run: |
          node -e "const d=JSON.parse(require('child_process').execSync('node dist/playground.js --json --tool=exec --cmd=\"rm -rf /\"').toString()); if(d.decision!=='DENY'){console.log('FAIL: got '+d.decision);process.exit(1)} console.log('PASS: '+d.decision)"
      - name: Smoke test — safe command must be ALLOW
        run: |
          node -e "const d=JSON.parse(require('child_process').execSync('node dist/playground.js --json --tool=read --path=\"README.md\"').toString()); if(d.decision!=='ALLOW'){console.log('FAIL: got '+d.decision);process.exit(1)} console.log('PASS: '+d.decision)"
