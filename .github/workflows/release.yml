name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: npm install

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - name: Smoke test — dangerous command must be DENY
        run: |
          node dist/playground.js --json --tool=exec --cmd="rm -rf /" | jq -r .decision | grep -q "DENY" || { echo "FAIL: rm -rf / was not denied"; exit 1; }
      - name: Smoke test — safe command must be ALLOW
        run: |
          node dist/playground.js --json --tool=read --path="README.md" | jq -r .decision | grep -q "ALLOW" || { echo "FAIL: read was not allowed"; exit 1; }

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/
            docs/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
