<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <text x="360" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">胜任力模型（五位一体）</text>
  <text x="360" y="70" text-anchor="middle" font-size="16" fill="#334155" font-family="monospace">Competence = Knowledge × Tools × Rules + Memory</text>

  <!-- 中心：胜任力 -->
  <ellipse cx="360" cy="220" rx="95" ry="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="360" y="214" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e40af">胜任力</text>
  <text x="360" y="236" text-anchor="middle" font-size="12" fill="#334155">Competence</text>

  <!-- 知识（乘数） -->
  <rect x="70" y="120" width="150" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="145" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">知识 Knowledge</text>
  <text x="145" y="172" text-anchor="middle" font-size="12" fill="#64748b">判断依据（×）</text>
  <line x1="220" y1="155" x2="268" y2="200" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 工具（乘数） -->
  <rect x="500" y="120" width="150" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="575" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">工具 Tools</text>
  <text x="575" y="172" text-anchor="middle" font-size="12" fill="#64748b">执行手段（×）</text>
  <line x1="500" y1="155" x2="452" y2="200" stroke="#22c55e" stroke-width="2"/>

  <!-- 规则（乘数） -->
  <rect x="70" y="280" width="150" height="70" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="145" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">规则 Rules</text>
  <text x="145" y="332" text-anchor="middle" font-size="12" fill="#64748b">行为边界（×）</text>
  <line x1="220" y1="315" x2="275" y2="260" stroke="#ef4444" stroke-width="2"/>

  <!-- 记忆（加数） -->
  <rect x="500" y="280" width="150" height="70" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="575" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">记忆 Memory</text>
  <text x="575" y="332" text-anchor="middle" font-size="12" fill="#64748b">经验积累（+）</text>
  <line x1="500" y1="315" x2="445" y2="260" stroke="#eab308" stroke-width="2"/>

  <!-- 会话（母体，底部说明） -->
  <text x="360" y="360" text-anchor="middle" font-size="13" fill="#64748b">会话（Session）= 任务母体，承载其余四要素协同</text>
</svg>
