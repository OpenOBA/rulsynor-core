<?xml version="1.0" encoding="UTF-8" standalone="no"?><!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd"><svg width="100%" height="100%" viewBox="0 0 3334 1917" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;"><rect x="0" y="0" width="3333.33" height="1916.67" style="fill:#fff;"/><path d="M3079.17,166.667c-0,-22.997 -18.671,-41.667 -41.667,-41.667l-2750,0c-22.996,0 -41.667,18.67 -41.667,41.667l0,250c0,22.996 18.671,41.666 41.667,41.666l2750,0c22.996,0 41.667,-18.67 41.667,-41.666l-0,-250Z" style="fill:#f8fafc;stroke:#94a3b8;stroke-width:8.33px;"/><text x="370.833px" y="258.333px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:91.667px;fill:#172033;">人机界面</text><text x="370.833px" y="383.333px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:66.667px;fill:#5b6475;">任务的入口与出口 · 关键节点的裁决与审批</text><path d="M1662.5,458.333l0,125" style="fill:none;fill-rule:nonzero;stroke:#64748b;stroke-width:8.33px;"/><path d="M1662.5,625l-25,-50l50,0l-25,50Z" style="fill:#64748b;fill-rule:nonzero;"/><path d="M3079.17,666.667c-0,-22.997 -18.671,-41.667 -41.667,-41.667l-2750,0c-22.996,0 -41.667,18.67 -41.667,41.667l0,333.333c0,22.996 18.671,41.667 41.667,41.667l2750,-0c22.996,-0 41.667,-18.671 41.667,-41.667l-0,-333.333Z" style="fill:#eff6ff;stroke:#1e56a0;stroke-width:8.33px;"/><text x="370.833px" y="758.333px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:91.667px;fill:#172033;">智能层（概率性）</text><text x="370.833px" y="883.333px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:62.5px;fill:#334155;">LLM 推理 · 知识检索 · 记忆召回 · 工具生态 · 人格表达</text><text x="370.833px" y="975px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:54.167px;fill:#5b6475;">有创造性、可泛化，但需受确定性层约束于边界内</text><path d="M1662.5,1041.67l0,125" style="fill:none;fill-rule:nonzero;stroke:#64748b;stroke-width:8.33px;"/><path d="M1662.5,1208.33l-25,-50l50,0l-25,50Z" style="fill:#64748b;fill-rule:nonzero;"/><path d="M3079.17,1250c-0,-22.996 -18.671,-41.667 -41.667,-41.667l-2750,0c-22.996,0 -41.667,18.671 -41.667,41.667l0,416.667c0,22.996 18.671,41.666 41.667,41.666l2750,0c22.996,0 41.667,-18.67 41.667,-41.666l-0,-416.667Z" style="fill:#f0fdf9;stroke:#0e7c66;stroke-width:8.33px;"/><text x="370.833px" y="1341.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:91.667px;fill:#172033;">确定性层（纯函数 / 协议）</text><text x="370.833px" y="1466.67px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:62.5px;fill:#334155;">意图转译 · 计划审查 · Action Guard · 表达式内核 · 工具隔离 · 审计链</text><text x="370.833px" y="1558.33px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:54.167px;fill:#5b6475;">相同输入恒得相同输出——行为边界由此确定，越界即拦、存疑升级</text><text x="370.833px" y="1650px" style="font-family:'PingFang SC Medium', 'PingFang SC', sans-serif;font-size:54.167px;fill:#0e7c66;">确定性层的存在不是限制，而是能力得以充分释放的前提</text></svg>