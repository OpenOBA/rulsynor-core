# ERDL Rule: Block writes to system paths
name: block-system-writes
version: 1
category: security
severity: high
description: "Block file writes to system directories"
when:
  conditions:
    - field: "context.tool.name"
      operator: eq
      value: "write_file"
    - field: "context.tool.args.path"
      operator: regex
      value: "^(/etc/|/sys/|/proc/|C:\\\\Windows|C:\\\\Program Files)"
then:
  decision: DENY
  instruction: "System file write blocked. Use application directory only."
