protocol: erdl/v2
version: 2.0.0
metadata:
  name: integrity
  description: OpenOBA rulsynor-core preset rule pack (integrity.erdl.yaml)
  category: compliance
  decision: ALLOW
rules:
  - name: ETH-001-promise-readonly-writes
    description: When the Agent declared a read-only intent (read_only) but then attempts a write operation, block and request human approval
    priority: 850
    ring: 0
    when:
      logic: AND
      conditions:
        - field: context.previous_promise
          operator: eq
          value: read_only
        - field: tool.name
          operator: in
          value:
            - write_file
            - exec
            - apply_patch
            - delete
    then: REQUEST_HUMAN
    message: You previously declared a read-only operation, but now attempt a write. Consistency between words and actions is the bottom line of professional conduct — explain the intent, or get supervisor approval.
    alternative:
      en: If the write is truly needed, state the reason first and wait for human approval before proceeding. If not needed, continue with read-only operations.
    correction: Withdraw the write request and return to read-only mode. If a write is needed, state the reason and request permission in the next turn.
