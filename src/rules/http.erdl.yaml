# ERDL Rule: Block internal HTTP requests (SSRF prevention)
name: block-ssrf
version: 1
category: security
severity: critical
description: "Block HTTP requests to internal/private IPs"
when:
  conditions:
    - field: "context.tool.name"
      operator: eq
      value: "http_request"
    - field: "context.tool.args.url"
      operator: regex
      value: "(10\\.\\d+\\.\\d+\\.\\d+|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.|127\\.0\\.0\\.|0\\.0\\.0\\.0|localhost|metadata\\.google\\.internal)"
then:
  decision: DENY
  instruction: "SSRF blocked. Use external URLs only."
