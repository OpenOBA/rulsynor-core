protocol: erdl/v2
version: 2.0.0
metadata:
  name: compliance
  description: OpenOBA rulsynor-core preset rule pack (compliance.erdl.yaml)
  category: security
  decision: ALLOW
rules:
  - name: CNV-001-require-tool-args
    description: Ensure exec commands have required arguments before execution
    priority: 200
    ring: 1
    when:
      logic: AND
      conditions:
        - field: tool.name
          operator: eq
          value: exec
        - field: tool.args.command
          operator: not_exists
    then: DENY
    category: writing
    message: 'Missing required argument: command.'
  - name: SEC-022-block-credential-in-files
    description: Detect and block credential patterns in file write content
    priority: 700
    ring: 1
    when:
      logic: AND
      conditions:
        - field: tool.name
          operator: eq
          value: write_file
        - field: tool.args.content
          operator: match
          value: (DATABASE_URL|PASSWORD|SECRET|API_KEY|TOKEN|password)\s*[=:]
    then: DENY
    message: Credential pattern detected in file content. Use environment variables or a secrets manager.
  - name: CMP-001-block-during-maintenance
    description: Block exec calls during system maintenance windows
    priority: 400
    ring: 1
    when:
      logic: AND
      conditions:
        - field: context.maintenance_mode
          operator: eq
          value: true
        - field: tool.name
          operator: eq
          value: exec
    then: DENY
    category: compliance
    message: System is in maintenance mode. Exec calls are suspended.
  - name: CMP-002-human-gdpr-delete
    description: Require human approval for GDPR-related data deletion and right-to-be-forgotten operations
    priority: 600
    ring: 1
    when:
      logic: AND
      conditions:
        - field: context.operation
          operator: eq
          value: delete
        - field: context.gdpr_relevant
          operator: eq
          value: true
    then: REQUEST_HUMAN
    category: compliance
    message: GDPR delete operation requires human approval. Please review and confirm deletion scope.
  - name: CMP-003-human-large-transaction
    description: Require human approval for financial transactions exceeding $5,000
    priority: 500
    ring: 1
    when:
      logic: AND
      conditions:
        - field: context.amount
          operator: gt
          value: 5000
        - field: context.transaction_type
          operator: eq
          value: financial
    then: REQUEST_HUMAN
    category: compliance
    message: Transaction exceeds $5,000 threshold. Human approval required.
  - name: SEC-023-halt-credential-leak
    description: Emergency halt when credential leak or secret exposure is detected
    priority: 1000
    ring: 0
    when:
      logic: AND
      conditions:
        - field: context.event_type
          operator: eq
          value: credential_leak
    then: EMERGENCY_HALT
    message: Credential leak detected. All operations halted. Rotate keys immediately.
  - name: SEC-024-quarantine-suspicious
    description: Quarantine tool calls matching suspicious reconnaissance patterns
    priority: 800
    ring: 1
    when:
      logic: AND
      conditions:
        - field: tool.name
          operator: eq
          value: exec
        - field: tool.args.command
          operator: match
          value: (whoami|id|uname\s+-a|cat\s+/etc/passwd|netstat|ss\s+-tlnp|ps\s+aux|env|printenv)
    then: QUARANTINE
    message: Suspicious reconnaissance command quarantined. Review required before execution.
  - name: CNV-002-allow-readonly
    description: Always allow read-only tool operations (read_file, list_dir, read, search, list)
    priority: 100
    ring: 3
    when:
      logic: AND
      conditions:
        - field: tool.name
          operator: in
          value:
            - read_file
            - list_dir
            - read
            - search
            - list
            - get
            - find
            - query
            - ls
    then: ALLOW
    category: writing
    instruction: Read-only operation allowed.
