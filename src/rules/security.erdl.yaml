name: SEC-001-block-dangerous-cmd
version: 1
category: security
severity: critical
ring: 0
priority: 900
description: 'Block destructive commands: rm -rf, format, shutdown, dd, redirect to /dev/sda, etc.'
when:
  conditions:
    - field: context.tool.name
      operator: eq
      value: exec
    - field: context.tool.args.command
      operator: match
      value: (rm\s+-rf|shutdown|reboot|mkfs\.|dd\s+if=|>\s*/dev/sda|:(){ :\|:& };:)
then:
  decision: DENY
  instruction: Destructive command blocked. Use safe alternatives or request human approval.
  alternative: Use the read tool to inspect the target first, or request explicit human approval before any destructive command.
---
name: SEC-002-block-fork-bomb
version: 1
category: security
severity: critical
ring: 0
priority: 890
description: Block fork bomb and process explosion patterns
when:
  conditions:
    - field: context.tool.name
      operator: eq
      value: exec
    - field: context.tool.args.command
      operator: match
      value: (:\()|fork\s*bomb|while\s*:\s*;\s*do
then:
  decision: DENY
  instruction: Fork bomb pattern detected and blocked.
---
name: SEC-003-block-system-writes
version: 1
category: security
severity: high
ring: 0
priority: 850
description: Block file writes to system directories and configuration paths
when:
  conditions:
    - field: context.tool.name
      operator: eq
      value: write_file
    - field: context.tool.args.path
      operator: match
      value: ^(/etc/|/sys/|/proc/|/boot/|/dev/|C:\\Windows|C:\\Program Files)
then:
  decision: DENY
  instruction: System file write blocked. Use application directory only.
  alternative: Write to your application's working directory (e.g. /var/app/) instead of system paths like /etc, /sys, or /proc.
---
name: SEC-004-block-dotfile-writes
version: 1
category: security
severity: medium
ring: 1
priority: 700
description: Block writes to dot-files and dot-directories (SSH keys, env files, git config)
when:
  conditions:
    - field: context.tool.name
      operator: eq
      value: write_file
    - field: context.tool.args.path
      operator: match
      value: (/\.ssh/|/\.git/config|/\.env|\.bashrc|\.zshrc|\.profile|authorized_keys)
then:
  decision: DENY
  instruction: Write to sensitive dot-file blocked. Review and approve manually.
  alternative: Store secrets in a secrets manager or environment injection, not in dot-files under version control.
---
name: SEC-005-block-ssrf
version: 1
category: security
severity: critical
ring: 0
priority: 850
description: 'SSRF prevention: block HTTP requests to internal/private IPs and metadata endpoints'
when:
  conditions:
    - field: context.tool.name
      operator: eq
      value: http_request
    - field: context.tool.args.url
      operator: match
      value: (10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.|192\.168\.|127\.0\.0\.|0\.0\.0\.0|localhost|metadata|169\.254\.)
then:
  decision: DENY
  instruction: SSRF blocked. Internal IP / metadata endpoint access denied.
  alternative: >-
    Call the internal service through the sanctioned service-mesh route, not by direct IP or the cloud metadata
    endpoint.
---
name: SEC-006-block-curl-ssrf
version: 1
category: security
severity: critical
ring: 0
priority: 855
description: 'SSRF prevention: block curl/wget to internal/private IPs and metadata endpoints'
when:
  conditions:
    - field: context.tool.name
      operator: eq
      value: exec
    - field: context.tool.args.command
      operator: match
      value: (curl|wget).*(169\.254\.|10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.|192\.168\.|127\.0\.0\.|0\.0\.0\.0|localhost|metadata)
then:
  decision: DENY
  instruction: SSRF via curl/wget blocked. Internal IP / metadata endpoint access denied.
  alternative: >-
    Call the internal service through the sanctioned service-mesh route, not by direct IP or the cloud metadata endpoint.
---
name: SEC-007-block-nonstandard-ports
version: 1
category: security
severity: medium
ring: 1
priority: 600
description: Block HTTP requests to unusual ports (common exploit targets)
when:
  conditions:
    - field: context.tool.name
      operator: eq
      value: http_request
    - field: context.tool.args.url
      operator: match
      value: ':(22|25|53|3389|6379|27017|11211|5432|3306)'
then:
  decision: DENY
  instruction: Non-standard port HTTP blocked. Verify destination before proceeding.
---
name: SEC-008-block-empty-command
version: 1
category: security
severity: low
ring: 1
priority: 400
description: Block exec calls with empty or whitespace-only command
when:
  conditions:
    - field: context.tool.name
      operator: eq
      value: exec
    - field: context.tool.args.command
      operator: match
      value: ^\s*$
then:
  decision: DENY
  instruction: Empty command blocked. Specify a valid command.
---
name: SEC-009-block-sql-injection
version: 1
category: security
severity: critical
ring: 0
priority: 880
description: Block SQL injection and XSS patterns in any tool argument
when:
  conditions:
    - field: context.tool.args.command
      operator: contains
      value: '''; DROP TABLE'
    - field: context.tool.args.url
      operator: contains
      value: '''; DROP TABLE'
    - field: context.tool.args.content
      operator: contains
      value: <script>
  logic: OR
then:
  decision: DENY
  instruction: SQL injection / XSS pattern detected and blocked.
---
name: SEC-010-block-large-writes
version: 1
category: security
severity: medium
ring: 1
priority: 650
description: Block file writes exceeding 10MB to prevent resource exhaustion
when:
  conditions:
    - field: context.tool.name
      operator: eq
      value: write_file
    - field: context.tool.args.content
      operator: length_gt
      value: 10485760
then:
  decision: DENY
  instruction: Write exceeds 10MB limit. Split into smaller files.
---
name: SEC-011-block-sensitive-temp-writes
version: 1
category: security
severity: medium
ring: 1
priority: 550
description: Block writes to /tmp if content contains passwords or tokens
when:
  conditions:
    - field: context.tool.args.path
      operator: starts_with
      value: /tmp/
    - field: context.tool.args.content
      operator: match
      value: (password|secret|token|api_key|private_key|-----BEGIN)
  logic: OR
then:
  decision: DENY
  instruction: Sensitive data in /tmp blocked. Use encrypted storage.
---
name: SEC-012-block-shell-metachar
version: 1
category: security
severity: high
ring: 1
priority: 750
description: Block commands containing shell meta-characters (command chaining, backticks, eval)
when:
  conditions:
    - field: context.tool.name
      operator: eq
      value: exec
    - field: context.tool.args.command
      operator: match
      value: '[;&|`$(){}]'
then:
  decision: DENY
  instruction: Shell meta-characters detected. Use parameterized command execution.
---
name: SEC-013-block-open-redirect
version: 1
category: security
severity: medium
ring: 1
priority: 500
description: Block HTTP URLs that appear to be open redirect targets
when:
  conditions:
    - field: context.tool.name
      operator: eq
      value: http_request
    - field: context.tool.args.url
      operator: contains
      value: redirect
then:
  decision: DENY
  instruction: Potential open redirect URL blocked.
---
name: SEC-014-correct-unsafe-path
version: 1
category: security
severity: medium
ring: 0
priority: 840
description: When write targets a restricted path, suggest correction to allowed app directory
when:
  conditions:
    - field: context.tool.args.path
      operator: starts_with
      value: /etc/
then:
  decision: CORRECT
  instruction: Change path from /etc/ to /var/app/. System paths are read-only.
  correction: Rewrite the write target to /var/app/ (or another application-owned directory) instead of /etc/.
---
name: SEC-015-block-multiline-cmd
version: 1
category: security
severity: high
ring: 0
priority: 870
description: Block commands containing newline characters (injection via multi-line)
when:
  conditions:
    - field: context.tool.args.command
      operator: contains
      value: |+

then:
  decision: DENY
  instruction: Multi-line command injection blocked.
---
name: SEC-016-block-base64-payload
version: 1
category: security
severity: medium
ring: 1
priority: 400
description: Block commands containing base64-encoded data (common obfuscation technique)
when:
  conditions:
    - field: context.tool.args.command
      operator: match
      value: echo\s+[A-Za-z0-9+/]{20,}=*\s*\|\s*(base64|sh|bash)
then:
  decision: DENY
  instruction: Base64-encoded command blocked. Use explicit, readable commands.
---
name: SEC-017-block-download-to-file
version: 1
category: security
severity: medium
ring: 1
priority: 600
description: Block wget/curl that saves output to filesystem without inspection
when:
  conditions:
    - field: context.tool.args.command
      operator: match
      value: (wget|curl).*(-o|-O)\s+
then:
  decision: DENY
  instruction: Download-to-file blocked. Use read tool for URL content inspection first.
---
name: SEC-018-block-chmod-777
version: 1
category: security
severity: high
ring: 1
priority: 700
description: Block chmod 777 and other overly permissive permission changes
when:
  conditions:
    - field: context.tool.args.command
      operator: match
      value: chmod.*777
then:
  decision: DENY
  instruction: chmod 777 blocked. Use minimum required permissions.
---
name: SEC-019-block-sql-drop
version: 1
category: security
severity: critical
ring: 0
priority: 885
description: Block DROP TABLE / DROP DATABASE statements in any tool argument
when:
  conditions:
    - field: context.tool.args.command
      operator: contains
      value: DROP TABLE
    - field: context.tool.args.command
      operator: contains
      value: DROP DATABASE
    - field: context.tool.args.url
      operator: contains
      value: DROP TABLE
    - field: context.tool.args.content
      operator: contains
      value: DROP TABLE
    - field: context.tool.args.content
      operator: contains
      value: DROP DATABASE
  logic: OR
then:
  decision: DENY
  instruction: Destructive DROP statement blocked. Use archived/soft-delete instead.
---
name: SEC-020-block-docker-privileged
version: 1
category: security
severity: critical
ring: 0
priority: 860
description: Block docker run with --privileged (host-level escalation)
when:
  conditions:
    - field: context.tool.args.command
      operator: contains
      value: docker run
    - field: context.tool.args.command
      operator: contains
      value: '--privileged'
then:
  decision: DENY
  instruction: Privileged container execution blocked. Use a least-privilege container profile.
---
name: SEC-021-block-curl-pipe-shell
version: 1
category: security
severity: high
ring: 1
priority: 680
description: Block piping a remote download straight into a shell (curl|sh, wget|bash)
when:
  conditions:
    - field: context.tool.args.command
      operator: match
      value: (curl|wget).*\|.*(sh|bash)
then:
  decision: DENY
  instruction: Pipe-to-shell download blocked. Inspect the content with the read tool before executing.
